<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <title>COLRA 운영관리</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- =========================================================
       COLRA 전체 화면 구조
       로그인 / 접속현황 / 출근대기 / 대기 / 초이스 / 일중
       픽업대기 / ㅈㅁ / 정산대기 / 퇴근정산
       전체 정산완료 / 정산내용 불러오기 / 등록관리
       ========================================================= -->

  <!-- =========================================================
       COLRA AI 비서 프로그램
       로그인 / 운영현황 / 출근대기 / 대기 / 초이스 / 일중
       픽업대기 / ㅈㅁ / 정산대기 / 퇴근정산 / 등록관리
       ========================================================= -->
  <!-- =========================================================
       1. 로그인 화면
       실장 선택 / 비밀번호 입력 / 로그인 처리
       ========================================================= -->
  <section
    id="loginScreen"
    class="login-screen"
  >
    <div class="login-card">
      <div class="brand">
        COLRA
      </div>

      <h1>
        AI 비서 프로그램
      </h1>

      <label for="loginManager">
        실장 선택
      </label>

      <select id="loginManager">
        <option value="실장A">
          colra1
        </option>

        <option value="실장B">
          Ghana
        </option>

        <option value="실장C">
          colra2
        </option>
      </select>

      <label for="loginPassword">
        비밀번호
      </label>

      <input
        id="loginPassword"
        type="password"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        placeholder="비밀번호 4자리"
      >

      <button
        id="loginBtn"
        class="btn primary full"
        type="button"
      >
        로그인
      </button>

      <div
        id="loginError"
        class="error"
      ></div>
    </div>
  </section>

  <!-- =========================================================
       2. 메인 앱
       로그인 성공 후 전체 운영화면
       ========================================================= -->
  <div
    id="mainApp"
    hidden
  >
    <!-- =====================================================
         2-1. 상단 헤더
         현재 실장명 / 로그아웃 / 백업
         ===================================================== -->
    <header>
      <div>
        <small>
          COLRA
        </small>

        <h1>
          오늘 운영현황
        </h1>
      </div>

      <div class="header-actions">
        <b id="currentManager"></b>

        <button
          id="logoutBtn"
          class="btn"
          type="button"
        >
          로그아웃
        </button>

        <button
          id="backupBtn"
          class="btn"
          type="button"
        >
          백업
        </button>
      </div>
    </header>

    <!-- =====================================================
         2-2. 실장 접속 상태
         colra1 / Ghana / colra2 접속 여부
         ===================================================== -->
    <div class="presence-bar">
      <span
        id="presenceA"
        class="presence offline"
      >
        colra1 미접속
      </span>

      <span
        id="presenceB"
        class="presence offline"
      >
        Ghana 미접속
      </span>

      <span
        id="presenceC"
        class="presence offline"
      >
        colra2 미접속
      </span>
    </div>

    <main>
      <!-- ===================================================
           3. 운영현황 요약
           출근대기 / 대기 / 초이스 / 일중 / 정산대기 건수
           =================================================== -->
      <section class="summary">
        <div>
          <span>
            대기
          </span>

          <strong id="waitingCount">
            0
          </strong>
        </div>

        <div>
          <span>
            초이스
          </span>

          <strong id="choiceCount">
            0
          </strong>
        </div>

        <div>
          <span>
            일중
          </span>

          <strong id="workingCount">
            0
          </strong>
        </div>

        <div>
          <span>
            정산대기
          </span>

          <strong id="pendingCount">
            0
          </strong>
        </div>
      </section>

      <!-- ===================================================
           4. 출근대기
           등록 / 출근취소 / ㅈㅁ / 출근
           =================================================== -->
      <section id="checkinWaitingSection">
        <div class="title">
          <h2>
            출근대기
          </h2>

          <div class="title-actions">
            <button
              id="checkinWaitingRegisterBtn"
              class="btn primary compact"
              type="button"
            >
              등록
            </button>

            <span id="checkinWaitingBadge">
              0명
            </span>
          </div>
        </div>

        <div
          id="checkinWaitingList"
          class="list"
        ></div>
      </section>

      <!-- ===================================================
           5. 대기
           언니정보 / 삭제 / 초이스
           =================================================== -->
      <section id="waitingSection">
        <div class="title">
          <h2>
            대기
          </h2>

          <span id="waitingBadge">
            0명
          </span>
        </div>

        <div
          id="waitingList"
          class="list"
        ></div>
      </section>

      <!-- ===================================================
           6. 초이스
           노래방 선택 / 대기복귀 / 통과
           =================================================== -->
      <section id="choiceSection">
        <div class="title">
          <h2>
            초이스
          </h2>

          <span id="choiceBadge">
            0명
          </span>
        </div>

        <div
          id="choiceList"
          class="list"
        ></div>
      </section>

      <!-- ===================================================
           7. 일중
           시작시간 / 경과시간 / 일끝
           =================================================== -->
      <section id="workingSection">
        <div class="title">
          <h2>
            일중
          </h2>

          <span id="workingBadge">
            0명
          </span>
        </div>

        <div
          id="workingList"
          class="list"
        ></div>
      </section>

      <!-- ===================================================
           8. 픽업대기
           전화 / 문자 / 메모 / 픽업완료
           =================================================== -->
      <section id="pickupSection">
        <div class="title">
          <h2>
            픽업대기
          </h2>

          <span id="pickupBadge">
            0명
          </span>
        </div>

        <div
          id="pickupList"
          class="list"
        ></div>
      </section>

      <!-- ===================================================
           9. ㅈㅁ
           대기 / 정산대기
           =================================================== -->
      <section id="jmSection">
        <div class="title">
          <h2>
            ㅈㅁ
          </h2>

          <span id="jmBadge">
            0명
          </span>
        </div>

        <div
          id="jmList"
          class="list"
        ></div>
      </section>

      <!-- ===================================================
           10. 정산대기 - colra1 전용
           일한 총금액
           본인보관
           실장보관
           노래방미수
           수수료
           기타금액
           언니 줄돈
           언니 받을돈
           =================================================== -->
      <section id="pendingSection">
        <div class="title">
          <h2>
            정산대기
          </h2>

          <span id="pendingBadge">
            0건
          </span>
        </div>

        <div
          id="pendingList"
          class="list"
        ></div>
      </section>

      <!-- ===================================================
           11. 퇴근정산 - colra1 전용
           마감 전 정산목록
           전체 정산완료
           정산 내용 불러오기
           내폰저장
           날짜별 DB 백업
           =================================================== -->
      <section id="doneSection">
        <div class="title">
          <h2>
            퇴근정산
          </h2>

          <div class="title-actions">
            <button
              id="todaySettlementBtn"
              class="btn primary compact"
              type="button"
            >
              오늘 전체 정산보기
            </button>

            <span id="doneBadge">
              0건
            </span>
          </div>
        </div>

        <div
          id="doneList"
          class="list"
        ></div>

        <!-- 전체 정산완료 / 정산 내용 불러오기 -->
        <div class="settlement-main-actions">
          <button
            id="finalizeAllSettlementBtn"
            class="btn primary settlement-finalize-btn"
            type="button"
          >
            전체 정산완료
          </button>

          <button
            id="loadSettlementBtn"
            class="btn settlement-load-btn"
            type="button"
          >
            정산 내용 불러오기
          </button>
        </div>
      </section>

      <!-- ===================================================
           12. 언니 및 노래방 등록·수정·삭제 관리
           =================================================== -->
      <section class="manage">
        <details>
          <summary>
            언니 등록·삭제 관리
          </summary>

          <button
            id="addStaffBtn"
            class="btn primary manage-btn"
            type="button"
          >
            + 언니등록
          </button>

          <div id="staffList"></div>
        </details>

        <!-- 노래방 관리 -->
        <details>
          <summary>
            노래방 등록·삭제 관리
          </summary>

          <button
            id="addShopBtn"
            class="btn primary manage-btn"
            type="button"
          >
            + 노래방등록
          </button>

          <div id="shopList"></div>
        </details>
      </section>
    </main>

    <!-- =====================================================
         13. 하단 고정 출근·퇴근 버튼
         ===================================================== -->
    <div class="bottom-actions">
      <button
        id="quickCheckInBtn"
        class="checkin"
        type="button"
      >
        출근
      </button>

      <button
        id="quickCheckOutBtn"
        class="checkout"
        type="button"
      >
        퇴근
      </button>
    </div>

    <!-- =====================================================
         14. 공통 팝업
         언니정보 / 전화 / 문자 / 등록 / 수정 / 정산
         ===================================================== -->
    <dialog id="dlg">
      <form
        method="dialog"
        id="form"
      >
        <h3 id="dlgTitle"></h3>

        <div id="dlgBody"></div>

        <menu>
          <button
            value="cancel"
            class="btn"
          >
            취소
          </button>

          <button
            value="ok"
            class="btn primary"
          >
            저장
          </button>
        </menu>
      </form>
    </dialog>
  </div>

  <!-- =========================================================
       15. PDF 화면 저장 라이브러리
       ========================================================= -->
  <script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    defer
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
    defer
  ></script>

  <!-- =========================================================
       16. COLRA 앱 실행 스크립트
       ========================================================= -->
  <script
    src="/app.js"
    defer
  ></script>
</body>
</html>
